# CI checks for the observability stack (Rule #0, guardrail 3: no config
# merged without a machine checking it). Pulled into the pipeline with:
#
#   include:
#     - local: hostinger/observability/ci.yml
#
# Same pinned images as compose.yaml, so CI checks with the very versions
# that run.

observability:prometheus:
  stage: test
  image:
    name: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    entrypoint: [""]
  rules:
    - changes: [hostinger/observability/**/*]
  script:
    - cd hostinger/observability/prometheus
    # Syntax of the config and of every rule file it loads.
    - promtool check config prometheus.yml
    # Every rule file's PromQL, then the unit tests: each alert fires when it
    # should and stays quiet when it shouldn't.
    - promtool check rules rules/*.rules.yml
    - cd tests && promtool test rules rules.test.yml

observability:alertmanager:
  stage: test
  image:
    name: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    entrypoint: [""]
  rules:
    - changes: [hostinger/observability/**/*]
  script:
    - amtool check-config hostinger/observability/alertmanager/alertmanager.yml

# Ships the stack to the VPS by rsync only. The deploy key is
# restrict,command="rrsync -wo ~/infra/observability": it can ONLY push into
# that directory — no shell, and it cannot read secrets/ back. The reload
# (docker compose up -d) is therefore NOT run from here: it is triggered on
# the VPS itself (systemd path/timer — to be decided). Until that exists,
# run `docker compose up -d` by hand on the VPS after a deploy.
observability:deploy:
  stage: deploy
  needs: ["observability:prometheus", "observability:alertmanager"]
  rules:
    # Only from main (a protected branch, so the protected DEPLOY_SSH_KEY is
    # exposed), and only when the observability stack actually changed.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [hostinger/observability/**/*]
  resource_group: hostinger # never two deploys to the VPS at once
  image: alpine:3.22.2@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
  variables:
    VPS: dev@147.93.89.3
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # DEPLOY_SSH_KEY and KNOWN_HOSTS are File-type CI variables: their value
    # is a path to a file holding the content.
    - install -m 600 "$DEPLOY_SSH_KEY" ~/.ssh/id_deploy
    - install -m 644 "$KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    # --delete keeps the VPS a mirror of git; secrets/ is excluded so the
    # write-only key never touches the hand-provisioned Telegram secrets, and
    # so --delete never removes them.
    - >-
      rsync -az --delete --exclude 'secrets/'
      -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
      hostinger/observability/ "$VPS:"
  after_script:
    - rm -f ~/.ssh/id_deploy
