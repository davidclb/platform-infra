# Lint of the Helm charts (Rule #0, guardrail 3).
#
# helm lint only for now: it checks chart structure and templating. Policy
# checks on the rendered manifests (conftest/Kyverno — no :latest, resources
# set, etc.) are a later layer and need Rego policies written first.
#
# Pulled into the pipeline with:
#   include:
#     - local: charts/ci.yml

charts:helm-lint:
  stage: test
  # Official-ish Helm image (alpine/helm tags without the leading v).
  # Helm 4 is recent — verify alpine/helm:4.3.2 exists on the first run.
  image:
    name: alpine/helm:4.3.2
    entrypoint: [""]
  rules:
    - changes: [charts/**/*]
  script:
    # Lint each chart. --strict turns warnings into failures. Tee the output
    # to a file (downloadable artifact) while keeping it in the job log. set
    # -o pipefail so a lint failure still fails the job through the tee.
    - set -o pipefail
    - helm lint charts/ghamr charts/yoshu --strict | tee helm-lint.txt
  artifacts:
    # when: always so the report is there even when the lint fails.
    when: always
    paths:
      - helm-lint.txt
    expire_in: 1 week
