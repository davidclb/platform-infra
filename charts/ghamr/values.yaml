replicaCount: 3
revisionHistoryLimit: 5
progressDeadlineSeconds: 300
minReadySeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

imagePullSecrets:
  - name: ghcr-pull-secret

app:
  name: ghamr

  
backend:
  name: backend
  image:
    repository: ghcr.io/davidclb/ghamr-backend
    tag: sha-ebcf89a424ff11c130f62ddc1c649fbb20531a22
  service:
    port: 80
    targetPort: 8080
  envFrom:
    - configMapRef:
        name: backend-config
    - secretRef:
        name: backend-secret
  config:
    PORT: "8080"
    DB_PATH: "data/ghamr.db"
    FRONTEND_URL: "https://ghamrr-lab.site"
    FREE_AI_DAILY_BUDGET_SECS: "72000"
    WEBSHARE_PROXY_HOST: "p.webshare.io"
    WEBSHARE_PROXY_PORT: "80"
    WEBSHARE_PROXY_USER: "wolazuvh-de-es-fr-it-us"
    SPEECHMATICS_RT_URL: "wss://eu2.rt.speechmatics.com/v2"
    SPEECHMATICS_RT_MAX: "45"

frontend:
  name: frontend
  image:
    repository: ghcr.io/davidclb/ghamr-frontend
    tag: sha-ebcf89a424ff11c130f62ddc1c649fbb20531a22
  service:
    port: 80
    targetPort: 80