# Values for the web-app dependency. A subchart only sees the values
# nested under its own name: at the top level, as they were before, Helm
# ignored them all and web-app's defaults ran instead (FRONTEND_URL
# http://192.168.1.111, among others).
# https://helm.sh/docs/chart_template_guide/subcharts_and_globals/
web-app:
  replicaCount: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  imagePullSecrets:
    - name: ghcr-pull-secret

  app:
    name: ghamr

  
  backend:
    name: backend
    image:
      repository: ghcr.io/davidclb/ghamr-backend
      tag: sha-466a76086beff4d732bac8423148a51d0b160514
    service:
      port: 80
      targetPort: 8080
      metricsPort: 9464        # Ghamr's /metrics listener (METRICS_ADDR)
      serviceMonitor:
        enabled: true          # scraped by the cluster Prometheus (kube-prometheus-stack)
    envFrom:
      - configMapRef:
          name: backend-config
      - secretRef:
          name: backend-secret
    config:
      PORT: "8080"
      METRICS_ADDR: ":9464"   # /metrics served on its own listener, not via the Ingress
      DB_PATH: "data/ghamr.db"
      ADMIN_EMAIL: "admin@admin.fr"   # IsAdmin: the account with this exact email is admin
      FRONTEND_URL: "https://ghamrr-lab.site"
      FREE_AI_DAILY_BUDGET_SECS: "72000"
      WEBSHARE_PROXY_HOST: "p.webshare.io"
      WEBSHARE_PROXY_PORT: "80"
      WEBSHARE_PROXY_USER: "wolazuvh-de-es-fr-it-us"
      SPEECHMATICS_RT_URL: "wss://eu2.rt.speechmatics.com/v2"
      SPEECHMATICS_RT_MAX: "45"

  frontend:
    name: frontend
    image:
      repository: ghcr.io/davidclb/ghamr-frontend
      tag: sha-466a76086beff4d732bac8423148a51d0b160514
    service:
      port: 80
      targetPort: 80
