---
- name: Install and bootstrap on the master node
  hosts: k3s_master
  become: true
  gather_facts: true

  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300
    - name: Disable apt-daily timers to prevent lock contention
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        masked: true
        state: stopped
      loop:
        - apt-daily.service
        - apt-daily.timer
        - apt-daily-upgrade.service
        - apt-daily-upgrade.timer
    - name: Install Python Kubernetes library
      ansible.builtin.apt:
        name: python3-kubernetes
        state: present
        update_cache: true
    - name: Install Flux Operator
      kubernetes.core.helm:
        name: flux-operator
        chart_ref: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
        chart_version: "{{ flux_operator_version }}"
        release_namespace: flux-system
        create_namespace: true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
    - name: Create Git deploy key secret
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: flux-system, namespace: flux-system }
          stringData:
            identity: "{{ flux_ssh_key }}"        # depuis Vault
            known_hosts: "{{ flux_known_hosts }}"
      no_log: true

    - name: Apply FluxInstance
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        template: flux-instance.yaml.j2