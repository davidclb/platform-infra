# Lint of the Ansible playbooks (Rule #0, guardrail 3: no config merged
# without a machine checking it).
#
# Static only: ansible-lint reads the playbooks, it does not reach the VMs
# (no inventory connection, no SSH). A real run (--check, then apply) needs
# the CI to reach the homelab over the network — a later layer.
#
# Pulled into the pipeline with:
#   include:
#     - local: ansible/ci.yml

ansible:lint:
  stage: test
  # Plain python image + pinned ansible-lint from PyPI: the version is
  # explicit and verifiable, no bundle-versioning confusion.
  image: python:3.13-slim
  rules:
    - changes: [ansible/**/*]
  variables:
    ANSIBLE_LINT_VERSION: "26.11.1"
  script:
    - pip install --no-cache-dir "ansible-lint==${ANSIBLE_LINT_VERSION}"
    - cd ansible
    # Install the collections the playbooks reference (requirements.yml) so
    # syntax-check can resolve modules like community.docker.docker_compose_v2
    # and kubernetes.core.helm instead of reporting unknown-module.
    - ansible-galaxy collection install -r homelab/requirements.yml
    # Lint every playbook. ansible-lint discovers them, applies the default
    # ruleset (plus .ansible-lint if present), and fails on violations.
    # -f codeclimate writes the CodeClimate JSON GitLab renders in the MR.
    # Write it to a file; ansible-lint's exit code (non-zero on findings)
    # propagates normally so the job still fails.
    - ansible-lint -f codeclimate > gl-codequality.json
  artifacts:
    # when: always so the report is uploaded even when the lint fails (which
    # is exactly when you want to read it).
    when: always
    reports:
      codequality: ansible/gl-codequality.json
