apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-grafana
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./infra/observability/grafana
  prune: true
  dependsOn:
    - name: observability   # the stack (Grafana Service) must exist first
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
