apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./infra/observability/alloy
  prune: true
  dependsOn:
    - name: loki            # Alloy pousse les logs vers Loki
    - name: tempo           # et forward les traces OTLP vers Tempo
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
