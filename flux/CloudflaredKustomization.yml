apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./infra/cloudflared
  prune: true
  wait: true
  dependsOn:
    - name: cloudflare-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
