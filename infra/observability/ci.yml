# Validation of the Grafana dashboards provisioned as code (ADR 0028).
# Rule #0, guardrail 3: no config merged without a machine checking it.
# Static only: parses the ConfigMaps, no cluster needed.
#
# Pulled into the pipeline with:
#   include:
#     - local: infra/observability/ci.yml

observability:dashboards:
  stage: test
  image: python:3.13-slim
  rules:
    - changes: [infra/observability/**/*]
  script:
    - pip install --no-cache-dir pyyaml
    - python infra/observability/validate_dashboards.py

# Render-check every HelmRelease under infra/observability/ (kube-prometheus-stack,
# loki, alloy, …): extract spec.values and `helm template` the chart — catches
# bad values / chart validation errors without a cluster (same loop as local
# dev, see helm_template_check.py docstring).
observability:helm-template:
  stage: test
  image:
    name: alpine/helm:4.3.2
    entrypoint: [""]
  rules:
    - changes: [infra/observability/**/*]
  before_script:
    - apk add --no-cache python3 py3-yaml
    - helm repo add grafana https://grafana.github.io/helm-charts
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    - helm repo update
  script:
    - python3 infra/observability/helm_template_check.py
