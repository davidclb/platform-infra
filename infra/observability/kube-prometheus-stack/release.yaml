---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m          # 5m too short
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.9.0" 
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    crds: CreateReplace   # install and update CRDs
  upgrade:
    crds: CreateReplace   # Flux updates CRDs helm doesn't
  values:
    prometheus:
      prometheusSpec:
        retention: 15d
        #  local PVC (ADR 0027, OCI migration later)
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    # port-forward, ADR 0027)
    grafana:
      service:
        type: ClusterIP
    # no notif route for now but active 
    alertmanager:
      enabled: true
