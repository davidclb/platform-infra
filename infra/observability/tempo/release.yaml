# Tempo single-binary (traces) — ADR 0027 amendment (2026-11-24: traces for
# Ghamr) + ADR 0031. Local PVC first, bounded retention, image pinned by digest.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"          # app Tempo 2.9.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: observability
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    tempo:
      image:
        repository: grafana/tempo
        tag: "2.9.0"
        # digest vérifié à la source (Docker Hub, 2026-11-27)
        digest: sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
      retention: 168h             # 7 jours, borné — cohérent avec Loki (ADR 0030)
    persistence:
      enabled: true
      size: 10Gi                  # stockage local d'abord (OCI plus tard, ADR 0027)
