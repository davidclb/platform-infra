# Grafana dashboard provisioned as code (ADR 0028). Same rules as
# cluster-overview.yaml: label grafana_dashboard=1, annotation grafana_folder,
# title prefixed "NN —" (alphabetical sort), stable uid.
#
# The JSON below is a PLACEHOLDER shell: the RED panels (rate / errors /
# duration per http_route) are written BY HAND by the repo owner.
# Metric source: Ghamr backend on the homelab, scraped via ServiceMonitor
# "backend" (job label = "backend-svc"), /metrics on :9464.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ghamr-red
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Homelab"
data:
  ghamr-red.json: |
    {
      "schemaVersion": 41,
      "uid": "ghamr-red-api",
      "title": "02 — Ghamr — RED (API)",
      "tags": ["homelab", "ghamr", "red", "api"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "datasource": { "type": "prometheus" },
      "templating": {
        "list": [
          {
            "name": "route",
            "type": "query",
            "datasource": { "type": "prometheus" },
            "query": { "query": "label_values(http_server_request_duration_seconds_count{job=\"backend-svc\"}, http_route)", "refId": "route" },
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Rate — requests/s by route",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests per second, by http_route",
          "description": "RED Rate. _count of the duration histogram = number of requests; rate over 5m. Filtered by the $route variable.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{job=\"backend-svc\",http_route=~\"$route\"}[5m]))", "refId": "A", "legendFormat": "{{http_route}}" }
          ]
        },
        {
          "id": 3,
          "type": "row",
          "title": "Errors — 5xx",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "5xx per second, by http_route",
          "description": "RED Errors. Same histogram, filtered on status 5xx. This is what GhamrHighErrorRate alerts on (>5% for 10m).",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{job=\"backend-svc\",http_route=~\"$route\",http_response_status_code=~\"5..\"}[5m]))", "refId": "A", "legendFormat": "{{http_route}}" }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Error ratio (5xx / all requests)",
          "description": "The alert threshold is 5% (GhamrHighErrorRate): yellow from 1%, red from 5%.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.01 }, { "color": "red", "value": 0.05 } ] } }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"backend-svc\",http_route=~\"$route\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{job=\"backend-svc\",http_route=~\"$route\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Duration — latency",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "collapsed": false
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latency p95 by http_route (s)",
          "description": "RED Duration. histogram_quantile over the _bucket series; le = bucket boundary label. Buckets come from the app (5ms..300s).",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{job=\"backend-svc\",http_route=~\"$route\"}[5m])))", "refId": "A", "legendFormat": "{{http_route}}" }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Requests in flight",
          "description": "http_server_active_requests — saturation side: how many requests are being served right now.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "sum(http_server_active_requests{job=\"backend-svc\"})", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "type": "row",
          "title": "Client errors — 4xx (429 rate-limit, 401 auth)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 },
          "collapsed": false
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "4xx per second, by route and status",
          "description": "Same request histogram, filtered on 4xx. 429 = rate limiter refused (quota), 401/403 = auth. User-visible but not an outage.",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "expr": "sum by (http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{job=\"backend-svc\",http_route=~\"$route\",http_response_status_code=~\"4..\"}[5m]))", "refId": "A", "legendFormat": "{{http_route}} {{http_response_status_code}}" }
          ]
        },
        {
          "id": 11,
          "type": "stat",
          "title": "429 rate-limited /s",
          "description": "Quota refusals per second. Red from 1/s: users are being throttled.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "reqps", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"backend-svc\",http_response_status_code=\"429\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "type": "row",
          "title": "Business — logins, payments, AI cost, realtime",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 36 },
          "collapsed": false
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Logins & Stripe events /s",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 37 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(ghamr_auth_logins_total{job=\"backend-svc\"}[5m]))", "refId": "A", "legendFormat": "logins/s" },
            { "expr": "sum(rate(ghamr_stripe_events_total{job=\"backend-svc\"}[5m]))", "refId": "B", "legendFormat": "stripe events/s" }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "AI cost: tokens/s + audio s/s by provider",
          "description": "gen_ai_client_token_usage (histogram -> _sum) = LLM tokens billed; ghamr_ai_audio_duration_seconds_total = audio seconds billed by transcription providers.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 37 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "sum by (gen_ai_provider_name) (rate(gen_ai_client_token_usage_sum{job=\"backend-svc\"}[5m]))", "refId": "A", "legendFormat": "tokens/s {{gen_ai_provider_name}}" },
            { "expr": "sum by (gen_ai_provider_name) (rate(ghamr_ai_audio_duration_seconds_total{job=\"backend-svc\"}[5m]))", "refId": "B", "legendFormat": "audio s/s {{gen_ai_provider_name}}" }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Realtime sessions: active vs limit",
          "description": "ghamr_realtime_sessions_active over ghamr_realtime_sessions_limit (SPEECHMATICS_RT_MAX). At the limit, viewers wait or fall back.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 37 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "ghamr_realtime_sessions_active{job=\"backend-svc\"}", "refId": "A", "legendFormat": "active" },
            { "expr": "ghamr_realtime_sessions_limit{job=\"backend-svc\"}", "refId": "B", "legendFormat": "limit" }
          ]
        }
      ]
    }
