# Grafana Alloy en DaemonSet : collecte les logs de tous les pods
# (/var/log/pods) et les pousse vers Loki. Le receiver OTLP (4317/4318) sera
# branché sur Tempo à l'étape traces (ADR 0027 amendment).
# Source de la config River : doc officielle Alloy « Collect Kubernetes logs »
# https://grafana.com/docs/alloy/latest/collect-logs/kubernetes/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: alloy
      version: "1.16.0"         # app Alloy v1.22.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: observability
  values:
    image:
      repository: grafana/alloy
      tag: v1.22.0
      # digest vérifié à la source (Docker Hub, 2026-11-27)
      digest: sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    controller:
      type: daemonset
    configMap:
      create: true
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
          rule { source_labels = ["__meta_kubernetes_pod_name"]            target_label = "pod" }
          rule { source_labels = ["__meta_kubernetes_namespace"]           target_label = "namespace" }
          rule { source_labels = ["__meta_kubernetes_pod_container_name"]  target_label = "container" }
          rule { source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"] target_label = "app" }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.outputs
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        // Traces : reçoit l'OTLP des apps (Ghamr envoie vers :4318) et forward
        // vers Tempo. Source : doc officielle Alloy otelcol components.
        otelcol.receiver.otlp "default" {
          grpc { endpoint = "0.0.0.0:4317" }
          http { endpoint = "0.0.0.0:4318" }
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo.observability.svc.cluster.local:4317"
            tls {
              insecure = true
            }
          }
        }
