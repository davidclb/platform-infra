apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-chart
      version: "10.10.5"
      sourceRef:
        kind: HelmRepository
        name: argo-chart
        namespace: argocd
  values:
    replicaCount: 2