apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: postgres
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: postgres-chart
        namespace: postgres
  values:
    replicaCount: 2