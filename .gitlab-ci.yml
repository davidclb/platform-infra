# CI for platform-infra — GitLab CI, deliberately separate from GitHub
# Actions used on the app repos (Ghamr/Yoshu/Arbre). See CLAUDE.md Rule #0:
# any AI-assisted infra config must pass this pipeline before merge.
#
# Tool versions here are pinned to match mise.toml (see mise.toml at the
# repo root for the source of truth used locally). Bump both together —
# there is no single source shared between local tooling and CI images.
#
# Stages mirror roadmap Phase 1.2. Jobs for file types not present yet
# (Helm charts, Dockerfiles) are already wired with `rules:` guards so
# they turn on by themselves once that content exists, instead of being
# bolted on after the fact.

stages:
  - validate
  - scan
  - plan
  - apply

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform

# ---- validate ----

tofu-fmt:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.12.6 # keep in sync with mise.toml opentofu
  rules:
    - changes:
        - "terraform/**/*.tf"
  script:
    - tofu fmt -check -recursive terraform/

tofu-validate:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.12.6 # keep in sync with mise.toml opentofu
  rules:
    - changes:
        - "terraform/**/*.tf"
  script:
    - cd terraform && tofu init -backend=false && tofu validate

helm-lint:
  stage: validate
  image: alpine/helm:3.16.1 # keep in sync with mise.toml helm
  rules:
    - changes:
        - "argocd/**/Chart.yaml"
        - "argocd/**/*.yaml"
  script:
    - >
      for chart in $(find argocd -name Chart.yaml -exec dirname {} \;); do
        helm lint "$chart";
      done

hadolint:
  stage: validate
  image: hadolint/hadolint:v2.12.0-alpine
  rules:
    - exists:
        - "**/Dockerfile"
  script:
    - find . -name Dockerfile -print -exec hadolint {} \;

# ---- scan ----

checkov:
  stage: scan
  image: bridgecrew/checkov:3.3.19 # keep in sync with mise.toml checkov
  rules:
    - changes:
        - "terraform/**/*.tf"
        - "argocd/**/*.yaml"
  script:
    - checkov --directory . --quiet

tfsec:
  stage: scan
  image: aquasec/tfsec:v1.28.14 # keep in sync with mise.toml tfsec
  rules:
    - changes:
        - "terraform/**/*.tf"
  script:
    - tfsec terraform/

kube-score:
  stage: scan
  image: zegl/kube-score:v1.20.0 # keep in sync with mise.toml kube-score
  rules:
    - changes:
        - "argocd/**/*.yaml"
  script:
    - >
      find argocd -name "*.yaml" -exec kube-score score {} +

trivy-config:
  stage: scan
  image: aquasec/trivy:0.74.0 # keep in sync with mise.toml trivy
  rules:
    - changes:
        - "terraform/**/*.tf"
        - "argocd/**/*.yaml"
  script:
    - trivy config .

# ---- plan ----

terragrunt-plan:
  stage: plan
  image: gruntwork/terragrunt:1.1.5 # keep in sync with mise.toml terragrunt
  rules:
    - changes:
        - "terraform/**/*.tf"
      if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "TODO once terragrunt.hcl files exist (homelab / oracle / aws)"
  allow_failure: true # no real modules to plan yet — remove once Phase 2.1 lands

# ---- apply ----

terragrunt-apply:
  stage: apply
  image: gruntwork/terragrunt:1.1.5 # keep in sync with mise.toml terragrunt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - echo "TODO once terragrunt.hcl files exist (homelab / oracle / aws)"
  allow_failure: true # no real modules to apply yet — remove once Phase 2.1 lands
