apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
spec:
  replicas: {{ .Values.backend.replicaCount | default .Values.replicaCount }}   # backend: 1 with a PVC (SQLite is single-writer)
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}        # Nombre d'anciennes versions conservées
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}   # Timeout pour une mise à jour
  minReadySeconds: {{ .Values.minReadySeconds }}            # Temps avant de considérer un Pod disponible
  strategy:
    type: {{ .Values.strategy.type }}          # ou Recreate
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}          # Pods indisponibles max pendant update
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}                # Pods supplémentaires max pendant update
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}                 # Doit correspondre aux labels du template
  template:                      # Template des Pods créés
    metadata:
      labels:
        app: {{ .Values.backend.name }}
      annotations:
        # envFrom is read at pod start: re-roll the pods when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.app.name }}-{{ .Values.backend.name }}
        image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
        ports:
          - name: http
            containerPort: {{ .Values.backend.service.targetPort }}
          {{- with .Values.backend.service.metricsPort }}
          # The Service's metrics port targets this name.
          - name: metrics
            containerPort: {{ . }}
          {{- end }}
        envFrom:
          {{- toYaml .Values.backend.envFrom | nindent 10 }}
        {{- if .Values.backend.persistence.enabled }}
        volumeMounts:
          - name: data
            mountPath: /app/data
        {{- end }}
      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.backend.name }}-data
      {{- end }}