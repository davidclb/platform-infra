apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.replicaCount }}                    # Nombre de Pods souhaités
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}        # Nombre d'anciennes versions conservées
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}   # Timeout pour une mise à jour
  minReadySeconds: {{ .Values.minReadySeconds }}            # Temps avant de considérer un Pod disponible
  strategy:
    type: {{ .Values.strategy.type }}          # ou Recreate
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}          # Pods indisponibles max pendant update
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}                # Pods supplémentaires max pendant update
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}                 # Doit correspondre aux labels du template
  template:                      # Template des Pods créés
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.app.name }}-{{ .Values.frontend.name }}
        image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}