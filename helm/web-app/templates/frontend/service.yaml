apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}-svc
  labels:
    app: {{ .Values.frontend.name }}
    app.kubernetes.io/part-of: {{ .Values.app.name }}
spec:
  selector:
    app: {{ .Values.frontend.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
