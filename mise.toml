[tools]
# Native mise registry (aqua backend)
ansible    = { version = "14.4.0", expose = ["ansible-core"] }
kubectl    = "1.31.0"
helm       = "3.16.1"
helmfile   = "1.8.0"
argocd     = "3.5.3"
cosign     = "3.1.3"
grype      = "0.119.0"
age        = "1.3.2"
gitleaks   = "8.30.1"
checkov    = "3.3.19"
kube-score = "1.20.0"
opentofu   = "1.12.6"
tfsec      = "1.28.14"
sops       = "3.13.3"
pre-commit = "4.6.2"
semgrep    = "1.177.0"

# Explicit GitHub backend (mise supports it natively, no external plugin needed)
"github:gruntwork-io/terragrunt" = "1.1.5"
"github:aquasecurity/trivy"      = "0.74.0"
"github:go-task/task"            = "3.53.1"
